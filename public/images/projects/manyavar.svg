<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bgGrad_manyavar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0e1320"/>
      <stop offset="100%" stop-color="#080b12"/>
    </linearGradient>
    <linearGradient id="cardGrad_manyavar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141928" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f1422" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid_manyavar" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGrad_manyavar)"/>
  <rect width="1200" height="750" fill="url(#grid_manyavar)"/>

  <!-- Top Decorative Glow -->
  <circle cx="950" cy="120" r="280" fill="#ec4899" opacity="0.12"/>
  <circle cx="200" cy="600" r="240" fill="#8b5cf6" opacity="0.08"/>

  <!-- Main Card Container -->
  <rect x="50" y="45" width="1100" height="660" rx="20" fill="url(#cardGrad_manyavar)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- Window Header Bar -->
  <rect x="50" y="45" width="1100" height="65" rx="20" fill="#181f30" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="50" y="90" width="1100" height="20" fill="#181f30"/>

  <!-- Window Controls -->
  <circle cx="85" cy="77" r="7" fill="#ef4444"/>
  <circle cx="110" cy="77" r="7" fill="#f59e0b"/>
  <circle cx="135" cy="77" r="7" fill="#10b981"/>

  <!-- Category Badge -->
  <rect x="170" y="62" width="220" height="30" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="280" y="82" fill="#ec4899" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">ENTERPRISE RETAIL ERP</text>

  <!-- Title in Header -->
  <text x="410" y="83" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Manyavar Retail ERP &amp; Logistics Sync</text>

  <!-- Project Info Section -->
  <text x="90" y="155" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800">Manyavar Retail ERP &amp; Logistics Sync</text>
  <text x="90" y="190" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400">Enterprise Inventory • Blue-dart Courier APIs • AJAX Pagination • RBAC</text>

  <!-- 4 KPI Cards -->
  <g transform="translate(90, 220)">
    <rect x="0" y="0" width="235" height="90" rx="12" fill="#181f32" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="20" y="32" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Inventory Catalog</text>
    <text x="20" y="68" fill="#f472b6" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700">45,000+ SKUs</text>

    <rect x="255" y="0" width="235" height="90" rx="12" fill="#181f32" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="275" y="32" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Courier Integration</text>
    <text x="275" y="68" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700">Blue-dart Webhooks</text>

    <rect x="510" y="0" width="235" height="90" rx="12" fill="#181f32" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="530" y="32" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">UI Navigation</text>
    <text x="530" y="68" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700">AJAX Dynamic Tables</text>

    <rect x="765" y="0" width="255" height="90" rx="12" fill="#181f32" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="785" y="32" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Data Reconcile</text>
    <text x="785" y="68" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700">Bulk CSV Sync</text>
  </g>

  <!-- Architecture & Code Terminal Block -->
  <g transform="translate(90, 335)">
    <rect x="0" y="0" width="1020" height="290" rx="14" fill="#0b0e17" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    
    <!-- Terminal Header -->
    <rect x="0" y="0" width="1020" height="42" rx="14" fill="#141824"/>
    <rect x="0" y="30" width="1020" height="12" fill="#141824"/>
    <circle cx="25" cy="21" r="5" fill="#f43f5e" opacity="0.8"/>
    <circle cx="42" cy="21" r="5" fill="#fbbf24" opacity="0.8"/>
    <circle cx="59" cy="21" r="5" fill="#10b981" opacity="0.8"/>
    <text x="80" y="26" fill="#64748b" font-family="monospace" font-size="13">App/Modules/BackendArchitecture.php</text>
    <text x="980" y="26" fill="#ec4899" font-family="monospace" font-size="12" text-anchor="end">Production v12.x</text>

    <!-- Code Block Lines -->
    <g transform="translate(30, 65)">
      <text x="0" y="25" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">$shipment = $bluedartLogistics-&gt;createConsignment([</text>
      <text x="0" y="51" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">    &#x27;order_id&#x27; =&gt; $order-&gt;id,</text>
      <text x="0" y="77" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">    &#x27;warehouse_sku&#x27; =&gt; $order-&gt;sku,</text>
      <text x="0" y="103" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">    &#x27;pincode&#x27; =&gt; $order-&gt;delivery_pincode,</text>
      <text x="0" y="129" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">]);</text>
      <text x="0" y="155" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">$order-&gt;update([&#x27;awb_number&#x27; =&gt; $shipment-&gt;awb, &#x27;status&#x27; =&gt; &#x27;Dispatched&#x27;]);</text>

    </g>

    <!-- Bottom Status Line Inside Terminal -->
    <line x1="20" y1="230" x2="1000" y2="230" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <circle cx="35" cy="255" r="5" fill="#34d399"/>
    <text x="50" y="259" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Blue-dart Courier API: Connected • Role-Based Warehouse Permissions • AJAX Paginated Grids</text>
  </g>
</svg>
